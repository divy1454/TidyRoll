name: Android app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.TIDYROLL_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the test app (debug APK)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Build the signed release (only when the signing secrets are set)
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          TIDYROLL_KEYSTORE_PASSWORD: ${{ secrets.TIDYROLL_KEYSTORE_PASSWORD }}
          TIDYROLL_KEY_ALIAS: ${{ secrets.TIDYROLL_KEY_ALIAS }}
          TIDYROLL_KEY_PASSWORD: ${{ secrets.TIDYROLL_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.TIDYROLL_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          export TIDYROLL_KEYSTORE="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: tidyroll-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

      - name: Name the APK for download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk tidyroll-test.apk

      - name: Publish the latest build as a download (every push to main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Tidyroll - latest build
          body: |
            Latest Android build of Tidyroll, made automatically from the main branch.
            Download **tidyroll-test.apk** below and open it on an Android 10+ phone. Allow installing from your browser or file manager when Android asks.
            Built from commit ${{ github.sha }}.
          files: tidyroll-test.apk
          overwrite_files: true
          make_latest: true

      - name: Attach the APK to the GitHub release (tags like v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            tidyroll-test.apk
          fail_on_unmatched_files: false
